<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Distribuidora Amenábar</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f3f4f6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .container {
      width: 100%;
      max-width: 420px;
    }
    .logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo h1 {
      font-size: 22px;
      font-weight: 700;
      color: #1f2937;
    }
    .logo p {
      font-size: 14px;
      color: #6b7280;
      margin-top: 4px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 14px;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .card:active {
      transform: scale(0.98);
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }
    .icon {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      flex-shrink: 0;
    }
    .icon-vendedor { background: #ede9fe; }
    .icon-admin { background: #dbeafe; }
    .icon-cliente { background: #fef3c7; }
    .card-text h2 {
      font-size: 16px;
      font-weight: 600;
      color: #111827;
    }
    .card-text p {
      font-size: 13px;
      color: #6b7280;
      margin-top: 2px;
    }
    .arrow {
      margin-left: auto;
      color: #d1d5db;
      font-size: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <h1>🏭 Distribuidora Amenábar</h1>
      <p>Seleccioná tu aplicación</p>
    </div>

    <a class="card" href="cliente_app.html">
      <div class="icon icon-cliente">🛒</div>
      <div class="card-text">
        <h2>Hacer un Pedido</h2>
        <p>Pedidos online — rápido y fácil</p>
      </div>
      <span class="arrow">›</span>
    </a>

    <a class="card" href="vendedor_app.html">
      <div class="icon icon-vendedor">🚚</div>
      <div class="card-text">
        <h2>App Vendedor</h2>
        <p>Preventas, clientes y seguimiento GPS</p>
      </div>
      <span class="arrow">›</span>
    </a>

    <a class="card" href="distribuidora_amenabar.html">
      <div class="icon icon-admin">📊</div>
      <div class="card-text">
        <h2>Panel Admin</h2>
        <p>Dashboard, logística y reportes</p>
      </div>
      <span class="arrow">›</span>
    </a>
  </div>
</body>
</html>
